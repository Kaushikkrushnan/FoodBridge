<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Volunteer Registration - FoodBridge</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC9Ydvs8WhexKOZjzE0U2tTOnEM0THlIms",
            authDomain: "foodbridge-c75de.firebaseapp.com",
            projectId: "foodbridge-c75de",
            storageBucket: "foodbridge-c75de.firebasestorage.app",
            messagingSenderId: "952654772110",
            appId: "1:952654772110:web:eca6f852147dc37ff0d6df",
            measurementId: "G-5T24X5YH90"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("registerForm");

            form.addEventListener("submit", async (e) => {
                e.preventDefault();

                // Fetch form values
                const name = document.getElementById("name").value.trim();
                const email = document.getElementById("email").value.trim();
                const phone = document.getElementById("phone").value.trim();
                const password = document.getElementById("password").value;
                const confirmPassword = document.getElementById("confirmPassword").value;

                // Client-side validation
                if (!name || !email || !phone) {
                    alert("Please fill all required fields.");
                    return;
                }

                if (password !== confirmPassword) {
                    alert("Passwords do not match.");
                    return;
                }

                // Disable submit button to prevent multiple submissions
                const submitBtn = document.getElementById("submitBtn");
                submitBtn.disabled = true;
                submitBtn.textContent = "Registering...";

                try {
                    // Firebase signup
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    // Get Firebase ID token
                    const idToken = await user.getIdToken();

                    // Prepare payload for backend registration
                    const payload = {
                        name,
                        email,
                        phone,
                        id_token: idToken
                    };

                    const response = await fetch("/register_volunteer", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(payload)
                    });
                    const data = await response.json();

                    if (response.ok && data.success) {
                        alert("Registration successful! Redirecting to dashboard...");
                        window.location.href = "/volunteer_dashboard";
                    } else {
                        alert(`Registration failed: ${data.message || "Unknown error"}`);
                        submitBtn.disabled = false;
                        submitBtn.textContent = "Register";
                    }
                } catch (error) {
                    alert(`Registration failed: ${error.message}`);
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Register";
                }
            });
        });
    </script>
</head>
<body>
    <div class="container">
        <h1>Volunteer Registration</h1>
        <form id="registerForm" class="simple-form">
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" placeholder="John Doe" required />
            </div>
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" placeholder="john@example.com" required />
            </div>
            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone" name="phone" placeholder="+1234567890" required />
            </div>
            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required />
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password *</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" required />
            </div>
            <button type="submit" id="submitBtn" class="btn-primary">Register</button>
        </form>
        <p>Already have an account? <a href="/volunteer_login">Login here</a></p>
    </div>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 400px;
            max-width: 90%;
        }
        h1 {
            margin-bottom: 24px;
            color: #343a40;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #495057;
            font-weight: 600;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            font-size: 1rem;
            border: 1px solid #ced4da;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.15s ease-in-out;
        }
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        input[type="password"]:focus {
            border-color: #007bff;
        }
        button {
            width: 100%;
            padding: 12px 0;
            background-color: #007bff;
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
        p {
            margin-top: 16px;
            text-align: center;
            color: #6c757d;
        }
        a {
            color: #007bff;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</body>
</html>
