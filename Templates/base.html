<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FoodBridge{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .food-donor-login-key {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background-color: #4f46e5;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            text-decoration: none;
            font-family: Arial, sans-serif;
        }
        .food-donor-login-key:hover {
            background-color: #4338ca;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Top-right user info display for any logged-in user -->
    {% if user_name and user_email and db_session_id %}
    <div class="food-donor-login-key">
        Logged in as: <span class="font-bold">{{ user_name }}</span><br>
        Email: <span>{{ user_email }}</span><br>
        Session ID: <span>{{ db_session_id }}</span>
    </div>
    <div style="position: fixed; top: 70px; right: 10px; z-index: 1000;">
        <a href="{{ url_for('auth.logout') }}" class="food-donor-login-key" style="background-color: #e53e3e; color: white;">Logout</a>
    </div>
    {% endif %}
    {% block content %}{% endblock %}
</body>
</html>
