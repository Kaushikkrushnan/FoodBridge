<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Food Donor Registration - FoodBridge</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" />
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --success: #10b981;
            --error: #ef4444;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .registration-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        .form-header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border-radius: 20px 20px 0 0;
            padding: 2rem;
            text-align: center;
            color: white;
        }
        
        .form-header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .form-header p {
            opacity: 0.9;
        }
        
        .form-body {
            padding: 2rem;
        }
        
        .input-group {
            margin-bottom: 1.25rem;
        }
        
        .input-group label {
            display: block;
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }
        
        .input-group input,
        .input-group textarea,
        .input-group select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.2s;
        }
        
        .input-group input:focus,
        .input-group textarea:focus,
        .input-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        
        .input-icon-wrapper {
            position: relative;
        }
        
        .input-icon-wrapper span {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.25rem;
        }
        
        .input-icon-wrapper input {
            padding-left: 3rem;
        }
        
        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(79, 70, 229, 0.5);
        }
        
        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #6b7280;
        }
        
        .login-link a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
        
        .error-message {
            background: #fef2f2;
            color: #991b1b;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            border: 1px solid #fecaca;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        
        @media (max-width: 640px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .ngo-select {
            background: #f9fafb;
        }
        
        .section-divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
        }
        
        .section-divider::before,
        .section-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .section-divider span {
            padding: 0 1rem;
            color: #6b7280;
            font-size: 0.875rem;
            font-weight: 500;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="registration-card w-full max-w-2xl">
        <div class="form-header">
            <div class="text-4xl mb-3">🍽️</div>
            <h1>Food Donor Registration</h1>
            <p>Join FoodBridge and help reduce food waste</p>
        </div>
        
        <div class="form-body">
            {% if error_message %}
            <div class="error-message">
                {{ error_message }}
            </div>
            {% endif %}
            
            <form id="registrationForm" method="POST" action="{{ url_for('auth.food_donor_register') }}">
                <div class="form-grid">
                    <div class="input-group">
                        <label for="name">Organization / Your Name</label>
                        <div class="input-icon-wrapper">
                            <span>👤</span>
                            <input type="text" name="name" id="name" required 
                                placeholder="e.g., City Bakery or John Doe" />
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <div class="input-icon-wrapper">
                            <span>📧</span>
                            <input type="email" name="email" id="email" 
                                placeholder="your@email.com" />
                        </div>
                    </div>
                </div>
                
                <div class="form-grid">
                    <div class="input-group">
                        <label for="phone">Phone Number</label>
                        <div class="input-icon-wrapper">
                            <span>📱</span>
                            <input type="tel" name="phone" id="phone" required 
                                pattern="[0-9]{7,15}" 
                                placeholder="Phone number (7-15 digits)" />
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label for="whatsapp_phone">WhatsApp Number</label>
                        <div class="input-icon-wrapper">
                            <span>💬</span>
                            <input type="tel" name="whatsapp_phone" id="whatsapp_phone" required 
                                pattern="[0-9]{7,15}"
                                placeholder="WhatsApp number (7-15 digits)" />
                        </div>
                    </div>
                </div>
                
                <div class="section-divider">
                    <span>Additional Details</span>
                </div>
                
                <div class="input-group">
                    <label for="vehicle_type">Vehicle Type (for pickup coordination)</label>
                    <select name="vehicle_type" id="vehicle_type" required>
                        <option value="">Select vehicle type</option>
                        <option value="bike">🏍️ Bike/Scooter</option>
                        <option value="car">🚗 Car</option>
                        <option value="van">🚐 Van</option>
                        <option value="truck">🚛 Truck</option>
                        <option value="none">❌ No Vehicle (Pickup Required)</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label for="address">Address</label>
                    <textarea name="address" id="address" required rows="2" 
                        placeholder="Enter your complete address for pickup coordination"></textarea>
                </div>
                
                <button type="submit" class="btn-submit">
                    🚀 Complete Registration
                </button>
            </form>
            
            <div class="login-link">
                Already have an account? 
                <a href="{{ url_for('auth.food_donor_login') }}">Login here</a>
            </div>
        </div>
    </div>
</body>
</html>
