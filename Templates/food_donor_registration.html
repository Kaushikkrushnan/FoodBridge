<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Food Donor Registration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-center">Food Donor Registration</h1>
        <form id="registrationForm" method="POST" action="{{ url_for('auth.food_donor_register') }}">
            <div class="mb-4">
                <label for="name" class="block text-gray-700 mb-2">Organization Name</label>
                <input type="text" name="name" id="name" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring focus:ring-indigo-500" />
            </div>
            <div class="mb-4">
                <label for="email" class="block text-gray-700 mb-2">Email</label>
                <input type="email" name="email" id="email" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring focus:ring-indigo-500" />
            </div>
            <div class="mb-4">
                <label for="phone" class="block text-gray-700 mb-2">Phone Number</label>
                <input type="tel" name="phone" id="phone" required pattern="[0-9]{10}" placeholder="Enter your 10-digit phone number" class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring focus:ring-indigo-500" />
            </div>
            <div class="mb-4">
                <label for="whatsapp_phone" class="block text-gray-700 mb-2">WhatsApp Phone Number</label>
                <input type="tel" name="whatsapp_phone" id="whatsapp_phone" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring focus:ring-indigo-500" />
            </div>
            <div class="mb-4">
                <label for="vehicle_type" class="block text-gray-700 mb-2">Vehicle Type</label>
                <input type="text" name="vehicle_type" id="vehicle_type" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring focus:ring-indigo-500" />
            </div>
            <div class="mb-4">
                <label for="address" class="block text-gray-700 mb-2">Address</label>
                <textarea name="address" id="address" required rows="3" class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring focus:ring-indigo-500"></textarea>
            </div>
            <div class="mb-4">
                <label for="selected_ngos" class="block text-gray-700 mb-2">Select NGO to Donate Food</label>
                <select name="selected_ngos" id="selected_ngos" required class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring focus:ring-indigo-500">
                    {% for ngo in ngos %}
                        <option value="{{ ngo.id }}">{{ ngo.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="flex justify-between items-center">
                <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded hover:bg-indigo-700 transition">Register</button>
                <a href="{{ url_for('auth.food_donor_login') }}" class="text-indigo-600 hover:underline">Already have an account? Login here.</a>
            </div>
        </form>
        <div id="message" class="mt-4 text-center text-red-600"></div>
    </div>
</body>
</html>
