<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script>
        // Firebase config from Flask
        const firebaseConfig = {{ firebase_config | tojson }};

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Make auth available globally
        window.firebaseAuth = auth;
    </script>
    <style>
        .auth-container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
        }
        .form-section {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .message {
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
        }
        .message.success {
            background: #d1fae5;
            color: #065f46;
        }
        .message.error {
            background: #fee2e2;
            color: #991b1b;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .auth-links {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }
        .auth-links p {
            margin-bottom: 1rem;
        }
        .auth-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .auth-links a:hover {
            text-decoration: underline;
        }
        .auth-button-link {
            display: block;
            text-decoration: none;
        }
        .auth-button {
            width: 100%;
            margin-top: 0.5rem;
            padding: 0.75rem;
            background: var(--bg);
            border: 2px solid var(--primary);
            color: var(--primary);
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }
        .auth-button:hover {
            background: var(--primary);
            color: white;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h1 style="text-align: center; color: var(--primary); margin-bottom: 2rem;">NGO Login</h1>
        
        <div class="form-section">
            {% if session.get('user_contact') %}
            <div class="food-donor-login-key" style="position: fixed; top: 10px; right: 10px; z-index: 1000; background-color: #4f46e5; color: white; padding: 8px 12px; border-radius: 6px; font-weight: bold;">Logged in as: {{ session['user_contact'] }}</div>
            {% endif %}
            <div id="login-message"></div>
            <form id="login-form">
                <div class="input-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="input-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            </form>
            
            <div class="auth-links">
                <p>Don't have an account?</p>
                <a href="{{ url_for('auth.ngo_register') }}" class="auth-button-link">
                    <button type="button" class="auth-button">Go to Registration Page</button>
                </a>
            </div>
        </div>

        <div style="text-align: center; margin-top: 2rem;">
            <a href="{{ url_for('index') }}" class="btn" style="background: var(--text-muted); color: white;">Back to Home</a>
        </div>
    </div>

    <script>
        // Login form
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            // Show loading
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<div class="loading"></div> Logging in...';
            submitBtn.disabled = true;

            try {
                // Sign in with Firebase
                const userCredential = await window.firebaseAuth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // Get ID token
                const idToken = await user.getIdToken();

                // Login via Flask backend
                const response = await fetch('/login_ngo', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        id_token: idToken
                    })
                });

                const data = await response.json();
                if (data.success) {
                    // Prevent button reset since we're redirecting
                    submitBtn.disabled = true;
                    
                    // Show popup message
                    alert('Login successful! Welcome to FoodBridge. Redirecting to your dashboard...');
                    
                    // Redirect to NGO dashboard after popup is closed
                    window.location.href = '/ngo_dashboard';
                } else {
                    showMessage('login-message', 'Login failed: ' + data.message, 'error');
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }
            } catch (error) {
                let errorMessage = 'Login failed';
                if (error.code === 'auth/user-not-found') {
                    errorMessage = 'No account found with this email';
                } else if (error.code === 'auth/wrong-password') {
                    errorMessage = 'Incorrect password';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'Invalid email address';
                } else if (error.message) {
                    errorMessage = error.message;
                }
                showMessage('login-message', errorMessage, 'error');
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });

        function showMessage(containerId, message, type) {
            const container = document.getElementById(containerId);
            container.innerHTML = `<div class="message ${type}">${message}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }
    </script>
</body>
</html>
